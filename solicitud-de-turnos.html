
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Reservar turno</title>

    <link rel="stylesheet" href="../css/reserva.css">
</head>

<body>

    <div class="contenedor">
        <h1>Reservar turno</h1>
        <p class="subtitulo">
            Elegí el día, horario y servicio para tu vehículo.
        </p>
        <form action="../php/reserva.php" method="POST">
            
            <div class="seccion">
                <h2>1. Elegí una fecha</h2>
                <input
                    type="date"
                    name="fecha"
                    required
                >
            </div>

            <div class="seccion">

                <h2>2. Elegí un horario</h2>

                <div class="horarios">

                    <label>
                        <input type="radio" name="hora" value="09:00" required>
                        <span>09:00</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="09:30">
                        <span>09:30</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="10:00">
                        <span>10:00</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="10:30">
                        <span>10:30</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="11:00">
                        <span>11:00</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="11:30">
                        <span>11:30</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="12:00">
                        <span>12:00</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="12:30">
                        <span>12:30</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="13:00">
                        <span>13:00</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="13:30">
                        <span>13:30</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="14:00">
                        <span>14:00</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="14:30">
                        <span>14:30</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="15:00">
                        <span>15:00</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="15:30">
                        <span>15:30</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="16:00">
                        <span>16:00</span>
                    </label>

                    <label>
                        <input type="radio" name="hora" value="16:30">
                        <span>16:30</span>
                    </label>

                </div>

            </div>

            <!-- SERVICIO / MOTIVO -->

            <div class="seccion">

                <h2>3. Elegí el servicio</h2>
                <select name="motivo" required>

                    <option value="">
                        Seleccionar servicio
                    </option>

                    <option value="Cambio de aceite">
                        Cambio de aceite
                    </option>

                    <option value="Alineación">
                        Alineación
                    </option>

                    <option value="Balanceo">
                        Balanceo
                    </option>

                    <option value="Revisión general">
                        Revisión general
                    </option>

                    <option value="Cambio de frenos">
                        Cambio de frenos
                    </option>

                </select>

            </div>

        <div class="botones">
            <button type="submit" class="Breservar">
                Reservar turno
            </button>
            <a href="cancelarTurno.html" class="cancelar">
                Cancelar turno
            </a>
        </div>        
        </form>
    </div>
</body>
</html>
